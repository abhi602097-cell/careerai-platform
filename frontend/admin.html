<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>CareerAI — Admin Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg0:#07080f;--bg1:#0d0f1c;--bg2:#12152b;--bg3:#181c36;--bg4:#1e2340;
  --border:rgba(99,112,255,.15);--border2:rgba(99,112,255,.3);
  --accent:#6370ff;--accent2:#a78bfa;--cyan:#22d3ee;--green:#34d399;
  --amber:#fbbf24;--red:#f87171;--orange:#fb923c;
  --text0:#f0f2ff;--text1:#b8bcde;--text2:#6b7099;--text3:#3d4270;
  --font-d:'Syne',sans-serif;--font-b:'DM Sans',sans-serif;
  --r:14px;--r-sm:8px;--r-xs:6px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg0);color:var(--text0);font-family:var(--font-b);font-size:14px;min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg1)}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:99px}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* Layout */
.layout{display:flex;min-height:100vh}
.sidebar{width:220px;min-height:100vh;background:var(--bg1);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;z-index:100}
.sidebar-logo{padding:24px 20px 18px;border-bottom:1px solid var(--border)}
.logo-mark{font-family:var(--font-d);font-size:17px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo-sub{font-size:9px;color:var(--text2);letter-spacing:1.5px;text-transform:uppercase;margin-top:2px}
.admin-badge{display:inline-block;background:rgba(248,113,113,.15);color:var(--red);border:1px solid rgba(248,113,113,.25);border-radius:4px;font-size:9px;font-weight:700;padding:1px 6px;margin-top:4px}
.sidebar-nav{flex:1;padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.nav-section{font-size:9px;font-weight:700;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase;padding:10px 10px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r-sm);color:var(--text2);cursor:pointer;transition:all .2s;font-size:13px;font-weight:500;border:1px solid transparent}
.nav-item:hover{background:var(--bg2);color:var(--text0)}
.nav-item.active{background:linear-gradient(135deg,rgba(99,112,255,.18),rgba(34,211,238,.06));color:var(--text0);border-color:var(--border)}
.nav-icon{font-size:15px;width:20px;text-align:center;flex-shrink:0}
.sidebar-footer{padding:14px;border-top:1px solid var(--border)}
.admin-pill{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg2);border-radius:var(--r-sm);border:1px solid var(--border)}
.admin-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--red),var(--orange));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:white;flex-shrink:0}
.admin-name{font-size:12px;font-weight:600;color:var(--text0)}
.admin-role{font-size:10px;color:var(--red)}
.main{margin-left:220px;flex:1;display:flex;flex-direction:column}
.topbar{background:var(--bg1);border-bottom:1px solid var(--border);padding:0 32px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.topbar-title{font-family:var(--font-d);font-size:16px;font-weight:700;color:var(--text0)}
.topbar-right{display:flex;align-items:center;gap:12px}
.topbar-time{font-size:12px;color:var(--text2)}
.btn-logout{padding:6px 14px;border-radius:var(--r-xs);border:1px solid var(--border);background:none;color:var(--text2);cursor:pointer;font-size:12px;font-family:var(--font-b);transition:all .2s}
.btn-logout:hover{border-color:var(--red);color:var(--red)}
.content{padding:28px 32px;flex:1}
.page{animation:fadeUp .35s ease}

/* Cards */
.card{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r);padding:20px}
.card-title{font-family:var(--font-d);font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.8px;margin-bottom:14px}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.kpi-card{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r);padding:20px;position:relative;overflow:hidden}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:var(--r) var(--r) 0 0}
.kpi-card.blue::before{background:linear-gradient(90deg,var(--accent),var(--cyan))}
.kpi-card.green::before{background:linear-gradient(90deg,var(--green),#10b981)}
.kpi-card.amber::before{background:linear-gradient(90deg,var(--amber),var(--orange))}
.kpi-card.pink::before{background:linear-gradient(90deg,#f472b6,var(--accent2))}
.kpi-icon{font-size:22px;margin-bottom:10px}
.kpi-num{font-family:var(--font-d);font-size:28px;font-weight:800;color:var(--text0);line-height:1}
.kpi-label{font-size:12px;color:var(--text2);margin-top:4px;text-transform:uppercase;letter-spacing:.6px}
.kpi-delta{font-size:11px;margin-top:8px;font-weight:600;color:var(--green)}

/* Chart grids */
.chart-row{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:16px}
.chart-row-equal{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.chart-wrap{position:relative;width:100%}
canvas{display:block;width:100%!important}

/* Table */
.table-wrap{overflow-x:auto;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--border);background:var(--bg2);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--border);color:var(--text1);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(99,112,255,.04)}
.user-cell{display:flex;align-items:center;gap:10px}
.u-avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:white;flex-shrink:0;background:linear-gradient(135deg,var(--accent),var(--cyan))}
.u-name{font-weight:600;color:var(--text0);font-size:13px}
.u-email{font-size:11px;color:var(--text2)}

/* Badges */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700;white-space:nowrap}
.badge-green{background:rgba(52,211,153,.12);color:var(--green);border:1px solid rgba(52,211,153,.2)}
.badge-red{background:rgba(248,113,113,.12);color:var(--red);border:1px solid rgba(248,113,113,.2)}
.badge-amber{background:rgba(251,191,36,.12);color:var(--amber);border:1px solid rgba(251,191,36,.2)}
.badge-accent{background:rgba(99,112,255,.12);color:var(--accent2);border:1px solid rgba(99,112,255,.2)}
.badge-cyan{background:rgba(34,211,238,.1);color:var(--cyan);border:1px solid rgba(34,211,238,.2)}
.badge-gray{background:rgba(107,112,153,.12);color:var(--text2);border:1px solid rgba(107,112,153,.2)}

/* Action buttons */
.action-row{display:flex;gap:6px;flex-wrap:wrap}
.btn-action{padding:4px 10px;border-radius:4px;font-size:11px;font-weight:600;cursor:pointer;border:none;font-family:var(--font-b);transition:all .2s}
.btn-view{background:rgba(99,112,255,.12);color:var(--accent2)}
.btn-view:hover{background:rgba(99,112,255,.25)}
.btn-disable{background:rgba(248,113,113,.12);color:var(--red)}
.btn-disable:hover{background:rgba(248,113,113,.25)}
.btn-enable{background:rgba(52,211,153,.12);color:var(--green)}
.btn-enable:hover{background:rgba(52,211,153,.25)}
.btn-role{background:rgba(251,191,36,.1);color:var(--amber)}
.btn-role:hover{background:rgba(251,191,36,.2)}

/* Filter bar */
.filter-bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.search-input{flex:1;min-width:200px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--text0);font-family:var(--font-b);font-size:13px;padding:9px 14px;outline:none;transition:border-color .2s}
.search-input:focus{border-color:var(--accent)}
.search-input::placeholder{color:var(--text2)}
.filter-select{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--text1);font-family:var(--font-b);font-size:13px;padding:9px 12px;outline:none;cursor:pointer}
.filter-select option{background:var(--bg1)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;align-items:center;justify-content:center}
.modal{background:var(--bg1);border:1px solid var(--border);border-radius:20px;padding:28px;width:90%;max-width:520px;max-height:80vh;overflow-y:auto;animation:fadeUp .3s ease}
.modal-title{font-family:var(--font-d);font-size:18px;font-weight:800;color:var(--text0);margin-bottom:20px;display:flex;justify-content:space-between;align-items:center}
.modal-close{cursor:pointer;color:var(--text2);font-size:22px;line-height:1;background:none;border:none;color:var(--text2)}
.detail-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.detail-row:last-child{border-bottom:none}
.detail-key{color:var(--text2)}
.detail-val{color:var(--text0);font-weight:500}

/* Activity */
.activity-item{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.activity-item:last-child{border-bottom:none}
.activity-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px}
.activity-dot.user{background:var(--accent)}
.activity-dot.pred{background:var(--green)}
.activity-text{font-size:13px;color:var(--text1)}
.activity-time{font-size:11px;color:var(--text2);margin-top:2px}

/* Mini progress */
.mini-progress{height:4px;background:var(--bg3);border-radius:99px;overflow:hidden;margin-top:4px}
.mini-bar{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--cyan))}

/* Spinner */
.spinner{width:18px;height:18px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
.loading-card{display:flex;align-items:center;justify-content:center;padding:48px;gap:12px;color:var(--text2)}

/* Section header */
.section-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}
.section-title{font-family:var(--font-d);font-size:22px;font-weight:800;color:var(--text0);letter-spacing:-.5px}
.section-sub{font-size:13px;color:var(--text2);margin-top:3px}

/* Toast */
.toast{position:fixed;bottom:24px;right:24px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px 16px;font-size:13px;color:var(--text0);z-index:300;animation:fadeUp .3s ease;box-shadow:0 4px 24px rgba(0,0,0,.4)}
.toast.success{border-color:rgba(52,211,153,.4);color:var(--green)}
.toast.error{border-color:rgba(248,113,113,.4);color:var(--red)}

/* Login page */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-card{background:var(--bg1);border:1px solid var(--border);border-radius:20px;padding:40px;width:100%;max-width:420px;animation:fadeUp .4s ease}
.login-input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--text0);font-family:var(--font-b);font-size:14px;padding:11px 14px;outline:none;margin-bottom:14px;transition:border-color .2s}
.login-input:focus{border-color:var(--accent)}
.login-btn{width:100%;padding:13px;border-radius:var(--r-sm);background:linear-gradient(135deg,var(--accent),#4f46e5);color:white;border:none;font-size:15px;font-weight:700;cursor:pointer;font-family:var(--font-b);margin-top:4px}
.login-btn-demo{width:100%;padding:11px;border-radius:var(--r-sm);background:var(--bg2);color:var(--text1);border:1px solid var(--border);font-size:13px;font-weight:500;cursor:pointer;font-family:var(--font-b);margin-top:10px}

@media(max-width:900px){
  .sidebar{transform:translateX(-100%)}
  .main{margin-left:0}
  .kpi-grid{grid-template-columns:1fr 1fr}
  .chart-row,.chart-row-equal{grid-template-columns:1fr}
  .content{padding:20px 16px}
}
</style>
</head>
<body>
<div id="root"><div style="color:#6b7099;text-align:center;padding:60px;font-family:sans-serif">Loading Admin Dashboard...</div></div>
<script>
var useState = React.useState;
var useEffect = React.useEffect;
var useRef = React.useRef;
var h = React.createElement;

var API_BASE = 'https://careerai-platform.onrender.com/api/v1';

var Auth = {
  getAccess:  function(){ return localStorage.getItem('ca_access'); },
  getRefresh: function(){ return localStorage.getItem('ca_refresh'); },
  getUser:    function(){ try{ return JSON.parse(localStorage.getItem('ca_user')); }catch(e){ return null; } },
  save: function(a,r,u){ localStorage.setItem('ca_access',a); localStorage.setItem('ca_refresh',r); localStorage.setItem('ca_user',JSON.stringify(u)); },
  clear: function(){ localStorage.removeItem('ca_access'); localStorage.removeItem('ca_refresh'); localStorage.removeItem('ca_user'); }
};

function api(method, path, body) {
  var token = Auth.getAccess();
  var headers = {'Content-Type':'application/json'};
  if (token) headers['Authorization'] = 'Bearer '+token;
  return fetch(API_BASE+path, {method:method, headers:headers, body:body?JSON.stringify(body):null})
    .then(function(res){ return res.json().then(function(d){ if(!res.ok) throw new Error(d.message||'Error'); return d.data; }); });
}

// ── Mock data ──────────────────────────────────────────────────────────────
var MOCK = {
  overview: {total_students:20,total_predictions:47,profiles_complete:12,new_today:3,new_this_week:9,active_this_week:14,avg_profile_completion:68},
  registrations: (function(){var a=[];for(var i=0;i<30;i++){var d=new Date(Date.now()-((29-i)*86400000));a.push({date:d.toISOString().slice(0,10),count:Math.floor(Math.random()*8+1)});}return a;})(),
  predictions: (function(){var a=[];for(var i=0;i<30;i++){var d=new Date(Date.now()-((29-i)*86400000));a.push({date:d.toISOString().slice(0,10),count:Math.floor(Math.random()*12+2)});}return a;})(),
  careers: [
    {career:'Machine Learning Engineer',count:18,pct:16.4},
    {career:'Data Scientist',count:15,pct:13.6},
    {career:'Software Engineer',count:14,pct:12.7},
    {career:'Web Developer',count:11,pct:10.0},
    {career:'AI Researcher',count:9,pct:8.2},
    {career:'Cloud Architect',count:8,pct:7.3},
    {career:'Product Manager',count:7,pct:6.4},
    {career:'Cybersecurity Analyst',count:6,pct:5.5}
  ],
  regions:[{region:'Telangana',count:6},{region:'Maharashtra',count:5},{region:'Karnataka',count:4},{region:'Tamil Nadu',count:3},{region:'Delhi',count:2}],
  degrees:[{degree:'B.Tech',count:9},{degree:'B.Sc',count:4},{degree:'MCA',count:3},{degree:'B.Com',count:2},{degree:'MBA',count:2}],
  users:{
    users:[
      {id:1,name:'Arjun Sharma',email:'arjun@test.com',role:'student',is_active:1,avatar_initials:'AS',created_at:'2025-01-15',degree:'B.Tech',region:'Telangana',gpa:3.7,pred_count:3,profile_complete:1},
      {id:2,name:'Priya Reddy',email:'priya@test.com',role:'student',is_active:1,avatar_initials:'PR',created_at:'2025-01-18',degree:'B.Com',region:'Maharashtra',gpa:3.3,pred_count:1,profile_complete:0},
      {id:3,name:'Rahul Nair',email:'rahul@test.com',role:'student',is_active:1,avatar_initials:'RN',created_at:'2025-01-20',degree:'M.Tech',region:'Karnataka',gpa:3.9,pred_count:5,profile_complete:1},
      {id:4,name:'Sneha Iyer',email:'sneha@test.com',role:'counselor',is_active:1,avatar_initials:'SI',created_at:'2025-01-22',degree:'MBA',region:'Tamil Nadu',gpa:null,pred_count:0,profile_complete:0},
      {id:5,name:'Dev Patel',email:'dev@test.com',role:'student',is_active:0,avatar_initials:'DP',created_at:'2025-01-25',degree:'BCA',region:'Gujarat',gpa:2.8,pred_count:2,profile_complete:0}
    ],
    total:5,page:1,per_page:20,total_pages:1
  },
  activity:[
    {type:'new_user',detail:'Arjun Sharma joined',ts:'2025-01-25 10:30'},
    {type:'prediction',detail:'Data Scientist predicted',ts:'2025-01-25 10:45'},
    {type:'new_user',detail:'Priya Reddy joined',ts:'2025-01-24 14:20'},
    {type:'prediction',detail:'ML Engineer predicted',ts:'2025-01-24 15:10'},

  ],

// ── Chart helpers ──────────────────────────────────────────────────────────
function LineChart(props) {
  var data = props.data, label = props.label, color = props.color||'#6370ff';
  var ref = useRef(); var cRef = useRef();
  useEffect(function(){
    if(!ref.current||!data||!data.length) return;
    if(cRef.current) cRef.current.destroy();
    cRef.current = new Chart(ref.current,{
      type:'line',
      data:{labels:data.map(function(d){return d.date.slice(5);}),
        datasets:[{label:label,data:data.map(function(d){return d.count;}),
          borderColor:color,backgroundColor:color+'18',fill:true,tension:.4,pointRadius:2,borderWidth:2}]},
      options:{responsive:true,plugins:{legend:{display:false},
        tooltip:{backgroundColor:'#1e2340',titleColor:'#f0f2ff',bodyColor:'#b8bcde',borderColor:'rgba(99,112,255,.3)',borderWidth:1}},
        scales:{x:{grid:{color:'rgba(99,112,255,.06)'},ticks:{color:'#6b7099',font:{size:10},maxTicksLimit:8}},
          y:{grid:{color:'rgba(99,112,255,.06)'},ticks:{color:'#6b7099',font:{size:10}},beginAtZero:true}}}
    });
    return function(){ if(cRef.current) cRef.current.destroy(); };
  },[data]);
  return h('div',{className:'chart-wrap'},h('canvas',{ref:ref,style:{maxHeight:'180px'}}));
}

function BarChart(props) {
  var data=props.data, lk=props.labelKey, vk=props.valueKey;
  var ref=useRef(); var cRef=useRef();
  useEffect(function(){
    if(!ref.current||!data||!data.length) return;
    if(cRef.current) cRef.current.destroy();
    var colors=data.map(function(_,i){return 'hsla('+(230+i*18)+',75%,'+(65-i*3)+'%,0.85)';});
    cRef.current = new Chart(ref.current,{
      type:'bar',
      data:{labels:data.map(function(d){return d[lk];}),
        datasets:[{data:data.map(function(d){return d[vk];}),backgroundColor:colors,borderRadius:6,borderSkipped:false}]},
      options:{indexAxis:'y',responsive:true,plugins:{legend:{display:false},
        tooltip:{backgroundColor:'#1e2340',titleColor:'#f0f2ff',bodyColor:'#b8bcde',borderColor:'rgba(99,112,255,.3)',borderWidth:1}},
        scales:{x:{grid:{color:'rgba(99,112,255,.06)'},ticks:{color:'#6b7099',font:{size:10}}},
          y:{grid:{display:false},ticks:{color:'#b8bcde',font:{size:11}}}}}
    });
    return function(){ if(cRef.current) cRef.current.destroy(); };
  },[data]);
  return h('div',{className:'chart-wrap'},h('canvas',{ref:ref,style:{maxHeight:'220px'}}));
}

function DonutChart(props) {
  var data=props.data, lk=props.labelKey, vk=props.valueKey;
  var ref=useRef(); var cRef=useRef();
  useEffect(function(){
    if(!ref.current||!data||!data.length) return;
    if(cRef.current) cRef.current.destroy();
    cRef.current = new Chart(ref.current,{
      type:'doughnut',
      data:{labels:data.map(function(d){return d[lk];}),
        datasets:[{data:data.map(function(d){return d[vk];}),
          backgroundColor:['#6370ff','#22d3ee','#34d399','#fbbf24','#f472b6','#a78bfa'],
          borderColor:'transparent',hoverOffset:8}]},
      options:{responsive:true,cutout:'65%',
        plugins:{legend:{position:'right',labels:{color:'#b8bcde',font:{size:11},padding:12,usePointStyle:true}},
          tooltip:{backgroundColor:'#1e2340',titleColor:'#f0f2ff',bodyColor:'#b8bcde',borderColor:'rgba(99,112,255,.3)',borderWidth:1}}}
    });
    return function(){ if(cRef.current) cRef.current.destroy(); };
  },[data]);
  return h('div',{className:'chart-wrap'},h('canvas',{ref:ref,style:{maxHeight:'200px'}}));
}

// ── KPI Card ──────────────────────────────────────────────────────────────
function KPICard(props) {
  var _s = useState(0), disp=_s[0], setDisp=_s[1];
  useEffect(function(){

  },[props.num]);

  );
}

        h('input',{className:'login-input',type:'password',placeholder:'Admin password',value:form.password,onChange:function(e){set('password',e.target.value);},required:true}),
